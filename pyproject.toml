[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "globuy"
version = "0.1.0"
description = "A learning-first AgentLoop project built with FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "faiss-cpu>=1.14,<2.0",
  "opensearch-py>=3.2,<4.0",
  "sentence-transformers>=5.0,<6.0",
  "httpx>=0.28,<1.0",
  "redis>=5.2,<8.0",
  "aiosqlite>=0.21,<1.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "asyncmy>=0.2.10,<1.0",
  "alembic>=1.16,<2.0",
  "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
