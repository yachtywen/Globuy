schema_version: "2.0"
cases:
  - id: exact_duplicate
    description: Exact normalized duplicates keep one current memory.
    actions:
      - { op: add, alias: first, memory: "我偏好轻便的通勤背包" }
      - { op: add, alias: duplicate, memory: "  我偏好轻便的通勤背包  " }
      - { op: list, alias: active }
    assertions:
      - { type: same_memory, left: first, right: duplicate }
      - { type: active_count, left: active, value: 1 }

  - id: update_and_confirmation
    description: Updates retain identity and repeated confirmation does not create audit versions.
    actions:
      - { op: add, alias: memory, memory: "我偏好黑色耳机" }
      - { op: update, target: memory, alias: changed, memory: "我现在偏好白色耳机" }
      - { op: confirm, target: changed, alias: confirmed }
      - { op: history, target: memory, alias: audit }
    assertions:
      - { type: same_memory, left: memory, right: changed }
      - { type: field_equals, left: confirmed, right: memory, value: "我现在偏好白色耳机" }
      - { type: history_events, left: audit, value: [ADD, UPDATE] }

  - id: delete_not_recalled
    description: Hard-deleted memories disappear from hybrid recall.
    actions:
      - { op: add, alias: memory, memory: "我对羊毛材质过敏" }
      - { op: project, alias: projected }
      - { op: delete, target: memory }
      - { op: recall, alias: after_delete, query: "羊毛材质" }
    assertions:
      - { type: recall_excludes, left: memory, value: after_delete }

  - id: user_isolation
    description: Recall never crosses user boundaries.
    actions:
      - { op: add, user: primary, alias: private, memory: "我喜欢静音机械键盘" }
      - { op: project, user: primary, alias: projected }
      - { op: recall, user: other, alias: other_recall, query: "静音机械键盘" }
    assertions:
      - { type: recall_excludes, left: private, value: other_recall }
