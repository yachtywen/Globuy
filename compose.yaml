services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GLOBUY_HOST: 0.0.0.0
      GLOBUY_PORT: 8000
      GLOBUY_OPENSEARCH_URL: http://opensearch:9200
      GLOBUY_REDIS_URL: redis://redis:6379/0
      GLOBUY_DATABASE_URL: ${GLOBUY_DOCKER_DATABASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./output:/workspace/output
    depends_on:
      opensearch:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  price-worker:
    build: .
    command: ["python", "-m", "app.products.price_worker", "--serve"]
    env_file:
      - path: .env
        required: false
    environment:
      GLOBUY_DATABASE_URL: ${GLOBUY_DOCKER_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  memory-outbox-worker:
    build: .
    command: ["python", "-m", "app.memory.outbox_worker", "--serve"]
    env_file:
      - path: .env
        required: false
    environment:
      GLOBUY_DATABASE_URL: ${GLOBUY_DOCKER_DATABASE_URL:-}
      GLOBUY_OPENSEARCH_URL: http://opensearch:9200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  product-outbox-worker:
    build: .
    command: ["python", "-m", "app.products.outbox_worker", "--serve"]
    env_file:
      - path: .env
        required: false
    environment:
      GLOBUY_DATABASE_URL: ${GLOBUY_DOCKER_DATABASE_URL:-}
      GLOBUY_OPENSEARCH_URL: http://opensearch:9200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    # 2.19+ includes the score-ranker RRF pipeline processor used by ItemSearch.
    # The previously tagged 3.7.0 image reported an incompatible 2.16 runtime.
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  opensearch-data:
