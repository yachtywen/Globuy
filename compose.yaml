services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GLOBUY_HOST: 0.0.0.0
      GLOBUY_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./output:/workspace/output
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
